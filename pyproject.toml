[project]
name = "model-distillation-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "peft>=0.19.1",
    "torch>=2.7",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
    "trl>=1.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins (don't shadow builtins)
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear (likely bugs)
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "E",     # pycodestyle errors
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FLY",   # flynt (.format -> f-string)
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # import conventions (np, pd, plt, ...)
    "ISC",   # implicit string concatenation
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "NPY",   # numpy-specific
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "PT",    # flake8-pytest-style
    "PTH",   # use pathlib over os.path
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "T10",   # flake8-debugger (forbid pdb/breakpoint, but allow print)
    "TC",    # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops (exception antipatterns)
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

ignore = [
    "ISC001",  # conflicts with the formatter
    "S101",    # `assert` is fine in research/demo code (shape checks etc.)
    "PLW2901", # for-loop variable overwritten — often intentional
    "TRY003",  # long messages outside exception class — too noisy
    "PLC0415", # imports not at top of file — sometimes needed for lazy torch/cuda import
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2
